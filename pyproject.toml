[project]
name = "khm-analyzer"
version = "0.1.0"
description = "Helps you analyze linguistically annotated editions of Grimm's Fairy Tales"
readme = "README.md"
authors = [
    { name = "fleetingbytes", email = "7075397+fleetingbytes@users.noreply.github.com" }
]
requires-python = ">=3.13"
license = "BSD-2-Clause"
dependencies = [
    "lxml",
    "platformdirs>=4.3.8",
    "requests>=2.32.5",
    "readylog",
    "click>=8.3.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
behave4khm-analyzer = { workspace = true }
khm-parser = { workspace = true }
khm-renderer = { workspace = true }

[project.scripts]
khm-analyzer = "khm_analyzer.cli:run"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "ruff>=0.14",
]
test = [
    "behave>=1.3.3",
    "behave4khm-analyzer",
    "pytest>=9",
]
