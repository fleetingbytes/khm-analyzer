name: CI Pipeline

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - !step
        name: Setup | Check out project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - !step
        name: Lint
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b  # v4.0.0
  upload-artifacts:
    name: Upload KHM Source Texts as Artifacts
    runs-on: ubuntu-latest
    steps:
      - !step
        name: Setup | Check out project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - !step
        name: Setup | Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - !step
        name: Setup | Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Setup | Install Project
        run: uv sync --locked

      - name: Setup | Download files from the DTA server
        #run: uv run khm-analyzer download-all-sources "khm-sources/khm.xml"
        run: uv run khm-analyzer download-source 1 1 "khm-sources/khm-ed1-vol1.xml"

      - !step
        name: Upload KHM source XML files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: artifacts
          path: khm-sources
          if-no-files-found: error

  test:
    needs: upload-artifacts
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.13, 3.14]
    runs-on: ${{ matrix.os }}

    steps:
      - !step
        name: Setup | Check out project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - !step
        name: Setup | Download KHM souce XML files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: artifacts
          path: khm-sources

      - name: Setup | Test the Presence of XML files
        if: runner.os == 'Linux'
        run: |
          [ 1 -eq $(find . -type f -name "khm-*" | sort | tee file_list.txt | wc -l) ]
          cat file_list.txt && rm file_list.txt

      - name: Setup | Test the Presence of XML files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fileList = Get-ChildItem -File -Recurse -Filter "khm-*" | Sort-Object FullName
          $fileList.FullName | Out-File -FilePath file_list.txt -Encoding utf8
          $isEqual = ($fileList.Count -eq 1)
          Get-Content file_list.txt
          Remove-Item file_list.txt

      - !step
        name: Setup | Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - !step
        name: Setup | Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup | Install the project
        run: uv sync --locked --group test

      - name: Unit Test
        run: uv run -- pytest -v

      - name: Behave Test
        run: uv run -- behave -f plain

  python-pkg-and-versions:
    runs-on: ubuntu-latest
    outputs:
      py-data: ${{ steps.define-python-data.outputs.data }}
    steps:
      - name: Set Python Data
        id: define-python-data
        run: |
          echo 'data=[{"pkg":"python313","version":"3.13"},{"pkg":"python314","version":"3.14"}]' >> $GITHUB_OUTPUT

  test-freebsd:
    continue-on-error: true
    needs:
      - upload-artifacts
      - python-pkg-and-versions
    name: Test-BSD
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: true
      UV_NO_MANAGED_PYTHON: true
    strategy:
      matrix:
        freebsd-release: ['14.2', '14.3', '15.0']
        python-data: ${{ fromJSON(needs.python-pkg-and-versions.outputs.py-data) }}
    steps:
      - !step
        name: Setup | Check out project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - !step
        name: Setup | Download KHM souce XML files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: artifacts
          path: khm-sources

      - name: Test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.freebsd-release }}
          envs: 'UV_LOCKED UV_NO_MANAGED_PYTHON'
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y libxml2 libxslt ${{ matrix.python-data.pkg }} rust uv
          run: |
            echo "===== Test the presence of artifacts ====="
            #[ 14 -eq $(find khm-sources -type f -name "khm-*" | sort | tee file_list.txt | wc -l) ]
            [ 1 -eq $(find khm-sources -type f -name "khm-*" | sort | tee file_list.txt | wc -l) ]
            cat file_list.txt && rm file_list.txt
            echo "===== Install the project ====="
            uv sync --group test --python ${{ matrix.python-data.version }}
            echo "===== Test the code ====="
            uv run --python ${{ matrix.python-data.version }} -- pytest -v
            uv run --python ${{ matrix.python-data.version }} -- behave -f plain
